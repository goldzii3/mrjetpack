<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13294f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mr.JETPACK スマホ横画面版（試作）</title>
<meta name="apple-mobile-web-app-title" content="Mr.JETPACK">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="mr_jetpack_icon_192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ===== 画面全体・セーフエリア ===== */
:root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    /* 左右パネル（紺色・文字は白） */
    --body: #13294f;
    --body-edge: #0a1731;
    --plate: #24467c;
    --plate-lo: #0b1a33;
    --ink: #ffffff;
    --ink-soft: #ffffff;
    --gold: #ffd700;
    --bezel: #070d18;

    /* ゲーム内の色をそのまま流用 */
    --hazard: #ffcc00;
    --hazard-ink: #1c1f24;
    --tank: #e00000;
    --tank-deep: #8a0000;
    --tank-band: #ffdd00;
    --flame: #ffa500;
    --visor: #00ffff;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --body: #0f2144;
        --body-edge: #060f22;
        --plate: #1e3b6a;
        --plate-lo: #081226;
        --ink: #ffffff;
        --ink-soft: #ffffff;
        --gold: #ffd700;
        --bezel: #000;
    }
}
:root[data-theme="dark"] {
    --body: #0f2144;
    --body-edge: #060f22;
    --plate: #1e3b6a;
    --plate-lo: #081226;
    --ink: #ffffff;
    --ink-soft: #ffffff;
    --gold: #ffd700;
    --bezel: #000;
}

*, *::before, *::after { box-sizing: inherit; }

html {
    height: 100%;
    scroll-padding-top: env(safe-area-inset-top, 0px);
    background: var(--body);
}
body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--body);
    color: var(--ink);
    font-family: "Press Start 2P", "DotGothic16", ui-monospace, "Courier New", monospace;
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

/* ===== レイアウト：左20% ／ ゲーム画面 ／ 右20% ===== */
#app {
    height: 100%;
    display: grid;
    grid-template-columns: 20% minmax(0, 1fr) 20%;
}
.panel {
    display: flex;
    flex-direction: column;
    gap: clamp(4px, 1.8vh, 10px);
    min-height: 0;
    padding: clamp(6px, 2.2vh, 12px) 10px;
    background: var(--body);
}
#left {
    padding-left: max(10px, env(safe-area-inset-left, 0px));
    border-right: 2px solid var(--body-edge);
}
#right {
    padding-right: max(10px, env(safe-area-inset-right, 0px));
    border-left: 2px solid var(--body-edge);
}

/* スタート足場の警戒ストライプを区切り線に */
.stripe {
    flex: none;
    height: clamp(5px, 1.8vh, 8px);
    border-radius: 2px;
    background: repeating-linear-gradient(-45deg,
        var(--hazard) 0 7px, var(--hazard-ink) 7px 14px);
}

/* ===== 左パネル：ステータス ===== */
.hud {
    flex: none;
    display: grid;
    gap: clamp(4px, 1.6vh, 9px);
    font-size: clamp(8px, 1.3vw, 14px);
    line-height: 1;
}
.stat {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    white-space: nowrap;
}
.lbl { color: var(--ink-soft); }
.coin-icon { width: 1.3em; height: 1.3em; flex: none; }
#hud-coins { color: var(--gold); }
.fuel { display: grid; gap: 5px; }
.fuel-track {
    height: clamp(8px, 2.6vh, 14px);
    border: 2px solid var(--ink);
    background: rgba(0, 0, 0, 0.45);
    padding: 1px;
}
#fuel-bar {
    height: 100%;
    width: 100%;
    background: #0f0;
}
#fuel-bar.mid  { background: #ff0; }
#fuel-bar.low  { background: #f90; }
#fuel-bar.crit { background: #f00; animation: blink 0.5s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0.35; } }

/* ===== 左パネル：左右にだけ倒れるレバー ===== */
.pad {
    flex: 1 1 0;
    min-height: 0;
}
#dpad {
    display: grid;
    place-items: center;
    container-type: size;
}
.stick {
    --tilt: 0deg;
    position: relative;
    width: 120px;
    height: 120px;
    width: min(100cqw, 100cqh);
    height: min(100cqw, 100cqh);
}
/* 台座（横長のガイド溝＝左右にしか動かないことを示す） */
.stick-gate {
    position: absolute;
    left: 3%;
    right: 3%;
    bottom: 12%;
    height: 20%;
    border-radius: 999px;
    background: linear-gradient(#050b16, #0f2040);
    box-shadow:
        inset 0 3px 6px rgba(0, 0, 0, 0.7),
        0 0 0 3px #2c5290,
        0 5px 0 3px #06101f;
}
.stick-gate::before {
    content: "";
    position: absolute;
    left: 30%;
    right: 30%;
    top: 40%;
    height: 20%;
    border-radius: 999px;
    background: #000;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.12);
}
.gate-arrow {
    position: absolute;
    top: 50%;
    width: 14%;
    height: 56%;
    transform: translateY(-50%);
    color: rgba(255, 255, 255, 0.45);
}
.gate-arrow.l { left: 9%; }
.gate-arrow.r { right: 9%; }
.stick.left .gate-arrow.l,
.stick.right .gate-arrow.r { color: var(--hazard); }
.stick.dash.left .gate-arrow.l,
.stick.dash.right .gate-arrow.r { color: var(--flame); }

/* レバー本体：台座の中心を支点に回転 */
.stick-lever {
    position: absolute;
    left: 31%;
    bottom: 22%;
    width: 38%;
    height: 72%;
    transform-origin: 50% 100%;
    transform: rotate(var(--tilt));
    transition: transform 0.16s cubic-bezier(0.3, 1.6, 0.5, 1); /* 指を離すとバネのように戻る */
}
.stick.dragging .stick-lever { transition: none; }
.stick-shaft {
    position: absolute;
    left: 39%;
    bottom: 0;
    width: 22%;
    height: 62%;
    border-radius: 999px 999px 3px 3px;
    background: linear-gradient(90deg, #6f7986, #eef1f5 45%, #a3acb7 70%, #56606c);
}
.stick-ball {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 52.8%; /* 正円になる高さ（38 ÷ 72） */
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #fff6c4 0 9%, #ffd21a 32%, #e0a800 68%, #9c7000);
    box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35), inset 0 -4px 6px rgba(0, 0, 0, 0.18);
}
.stick.dash .stick-ball {
    background: radial-gradient(circle at 34% 30%, #fff1d6 0 9%, #ffb347 32%, #ff8c00 68%, #a85400);
    box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35), 0 0 16px 4px var(--flame);
}
/* 支点のカバー（軸が台座に差し込まれて見えるように） */
.stick-washer {
    position: absolute;
    left: 38%;
    bottom: 18%;
    width: 24%;
    height: 8%;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 40%, #33404f, #0b1320 70%);
    box-shadow: 0 0 0 2px #7d8896;
}

/* ===== 画面中央：ゲーム ===== */
#screen {
    position: relative;
    min-width: 0;
    min-height: 0;
    display: grid;
    place-items: center;
    background: var(--bezel);
    overflow: hidden;
}
#gameCanvas { display: block; }

#message-overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 3.2vh, 20px);
    padding: 12px;
    background: rgba(0, 0, 0, 0.72);
    color: #fff;
    text-align: center;
}
#main-title {
    margin: 0;
    font-size: clamp(18px, 8vh, 44px);
    line-height: 1.2;
    color: #ffd700;
    text-shadow: 0.1em 0.1em 0 #b8860b;
}
#game-message {
    font-family: "DotGothic16", sans-serif;
    font-size: clamp(13px, 4.4vh, 21px);
    line-height: 1.5;
    white-space: pre-line;
}
#game-message:empty { display: none; }
.legend {
    display: grid;
    grid-template-columns: auto auto;
    align-items: center;
    gap: clamp(4px, 1.4vh, 8px) 12px;
    font-family: "DotGothic16", sans-serif;
    font-size: clamp(12px, 3.8vh, 17px);
    text-align: left;
    color: #d9dee4;
}
.key {
    justify-self: end;
    font-family: "Press Start 2P", monospace;
    font-size: 0.72em;
    padding: 0.35em 0.55em;
    border: 2px solid currentColor;
    border-radius: 4px;
    color: #fff;
}
.key.jet { background: var(--tank); border-color: var(--tank-band); }
#action-button {
    padding: 0.8em 1.4em;
    font: inherit;
    font-size: clamp(11px, 3.8vh, 18px);
    color: #fff;
    background-color: #4CAF50;
    border: 4px solid #fff;
    box-shadow: 0 5px 0 #2e6b31;
    cursor: pointer;
    touch-action: manipulation;
}
#action-button:active { transform: translateY(5px); box-shadow: none; }
#action-button:focus-visible { outline: 3px solid var(--visor); outline-offset: 4px; }

/* ===== 右パネル：ミニマップ・設定 ===== */
.map-wrap {
    flex: none;
    width: 100%;
    aspect-ratio: 4 / 3;
    border: 2px solid var(--bezel);
    border-radius: 6px;
    background: #07090c;
    overflow: hidden;
}
#minimap { display: block; width: 100%; height: 100%; }
.tools {
    flex: none;
    display: flex;
    gap: 6px;
}
.tool {
    flex: 1;
    height: clamp(26px, 8.5vh, 38px);
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: var(--plate);
    color: var(--ink);
    box-shadow: inset 0 -3px 0 var(--plate-lo);
    cursor: pointer;
    touch-action: manipulation;
}
.tool svg { width: 20px; height: 20px; }
.tool:active { transform: translateY(1px); box-shadow: inset 0 2px 0 rgba(0,0,0,.3); }
.tool:focus-visible { outline: 3px solid var(--visor); outline-offset: 2px; }
.tool[hidden] { display: none; }

/* ===== 右パネル：ジェットボタン（燃料タンクの配色） ===== */
#jet-zone {
    display: grid;
    place-items: center;
    container-type: size;
}
#btn-jet {
    width: 88px;
    height: 88px;
    width: min(100cqw, calc(100cqh - 8px));
    height: min(100cqw, calc(100cqh - 8px));
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 4px solid var(--hazard-ink);
    background:
        linear-gradient(to bottom,
            transparent 39%, var(--tank-band) 39%, var(--tank-band) 61%, transparent 61%),
        radial-gradient(circle at 35% 28%, #ff5a4a, var(--tank) 48%, var(--tank-deep));
    box-shadow: 0 6px 0 #5c0000;
}
#btn-jet span {
    font-size: 14px;
    font-size: calc(min(100cqw, 100cqh) * 0.17);
    color: var(--hazard-ink);
}
#btn-jet.on {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #5c0000, 0 0 22px 4px var(--flame);
    background:
        linear-gradient(to bottom,
            transparent 39%, #ffee55 39%, #ffee55 61%, transparent 61%),
        radial-gradient(circle at 35% 28%, #ff8a5a, #ff2a10 48%, #b00000);
}

/* ===== ホーム画面追加の案内（ブラウザで開いたときだけ表示） ===== */
.install-hint {
    display: flex;
    align-items: center;
    gap: 0.5em;
    margin: 0;
    padding: 0.45em 0.9em;
    border: 1.5px solid rgba(255, 204, 0, 0.55);
    border-radius: 8px;
    background: rgba(255, 204, 0, 0.1);
    color: #ffe27a;
    font-family: "DotGothic16", sans-serif;
    font-size: clamp(11px, 3.4vh, 15px);
    line-height: 1.4;
    text-align: left;
}
.install-hint svg { flex: none; width: 1.3em; height: 1.3em; }
#rotate .install-hint { font-size: 15px; max-width: 22em; }

/* ===== 縦向きのとき ===== */
#rotate {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    background: var(--body);
    color: #fff;
    font-family: "DotGothic16", sans-serif;
    font-size: 18px;
    line-height: 1.6;
    text-align: center;
}
#rotate > svg { width: 88px; height: 88px; animation: tilt 2.4s ease-in-out infinite; }
@keyframes tilt {
    0%, 25% { transform: rotate(0deg); }
    55%, 100% { transform: rotate(-90deg); }
}
@media (orientation: portrait) and (pointer: coarse) {
    #rotate { display: flex; }
}

@media (prefers-reduced-motion: reduce) {
    #fuel-bar.crit, #rotate > svg { animation: none; }
}

.hidden { display: none !important; }
</style>
</head>
<body>

<div id="app">
    <!-- 左パネル：ステータス＋方向ボタン -->
    <aside id="left" class="panel">
        <div class="hud">
            <div class="stat"><span class="lbl">STAGE</span><b id="hud-stage">1</b></div>
            <div class="stat">
                <svg class="coin-icon" viewBox="0 0 16 16" aria-hidden="true">
                    <circle cx="8" cy="8" r="7.5" fill="#FFD700"/><circle cx="8" cy="8" r="4.5" fill="#DAA520"/>
                </svg>
                <b id="hud-coins">0/10</b>
            </div>
            <div class="fuel">
                <span class="lbl">FUEL</span>
                <div class="fuel-track"><div id="fuel-bar"></div></div>
            </div>
        </div>
        <div class="stripe"></div>
        <div id="dpad" class="pad">
            <div class="stick" id="stick" aria-hidden="true">
                <div class="stick-gate">
                    <svg class="gate-arrow l" viewBox="0 0 10 12"><path d="M9 0v12L0 6z" fill="currentColor"/></svg>
                    <svg class="gate-arrow r" viewBox="0 0 10 12"><path d="M1 0v12l9-6z" fill="currentColor"/></svg>
                </div>
                <div class="stick-lever">
                    <div class="stick-shaft"></div>
                    <div class="stick-ball"></div>
                </div>
                <div class="stick-washer"></div>
            </div>
        </div>
    </aside>

    <!-- 中央：ゲーム画面 -->
    <main id="screen">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="message-overlay">
            <h1 id="main-title">Mr.JETPACK</h1>
            <div id="game-message"></div>
            <div id="legend" class="legend">
                <span class="key">◀ ▶</span><span>レバーで向きを変える（倒し続けるとダッシュ）</span>
                <span class="key jet">JET</span><span>ジェット噴射</span>
            </div>
            <button id="action-button" type="button">START GAME</button>
            <p id="install-hint" class="install-hint hidden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9H6v11h12V9h-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 15V3M8 7l4-4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="install-hint-text"></span></p>
        </div>
    </main>

    <!-- 右パネル：ミニマップ＋設定＋ジェットボタン -->
    <aside id="right" class="panel">
        <div class="map-wrap" id="map-wrap"><canvas id="minimap"></canvas></div>
        <div class="tools">
            <button class="tool" id="btn-sound" type="button" aria-label="効果音のオン・オフ" aria-pressed="true">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/>
                    <g id="snd-on" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>
                    </g>
                    <g id="snd-off" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                        <path d="M15 9l6 6M21 9l-6 6"/>
                    </g>
                </svg>
            </button>
            <button class="tool" id="btn-pause" type="button" aria-label="一時停止">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <g id="ico-pause" fill="currentColor"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></g>
                    <path id="ico-play" d="M6 4v16l14-8z" fill="currentColor"/>
                </svg>
            </button>
            <button class="tool" id="btn-full" type="button" aria-label="全画面表示">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6" fill="none" stroke="currentColor" stroke-width="2.6"/>
                </svg>
            </button>
        </div>
        <div class="stripe"></div>
        <div id="jet-zone" class="pad">
            <div id="btn-jet" aria-hidden="true"><span>JET</span></div>
        </div>
    </aside>
</div>

<div id="rotate" role="alert">
    <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="20" y="6" width="24" height="46" rx="4" fill="none" stroke="#ffcc00" stroke-width="3"/>
        <rect x="28" y="45" width="8" height="3" fill="#ffcc00"/>
    </svg>
    <p>スマホを横向きにして<br>プレイしてください</p>
    <p id="rotate-hint" class="install-hint hidden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9H6v11h12V9h-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 15V3M8 7l4-4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="install-hint-text"></span></p>
</div>

<script>
'use strict';

// ============================================================
//  DOM
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const screenEl = document.getElementById('screen');
const leftPanel = document.getElementById('left');
const rightPanel = document.getElementById('right');
const dpadEl = document.getElementById('dpad');
const jetZoneEl = document.getElementById('jet-zone');
const stickEl = document.getElementById('stick');
const btnJet = document.getElementById('btn-jet');
const fuelBar = document.getElementById('fuel-bar');
const hudStage = document.getElementById('hud-stage');
const hudCoins = document.getElementById('hud-coins');
const messageOverlay = document.getElementById('message-overlay');
const mainTitle = document.getElementById('main-title');
const gameMessage = document.getElementById('game-message');
const legendEl = document.getElementById('legend');
const actionButton = document.getElementById('action-button');
const btnSound = document.getElementById('btn-sound');
const btnPause = document.getElementById('btn-pause');
const btnFull = document.getElementById('btn-full');
const mapWrap = document.getElementById('map-wrap');
const miniCanvas = document.getElementById('minimap');
const miniCtx = miniCanvas.getContext('2d');
const installHint = document.getElementById('install-hint');

// ============================================================
//  ホーム画面追加の案内
//  iPhone / iPad のブラウザで開いたときだけ表示し、
//  ホーム画面のアイコンから起動したとき（Webアプリ表示）は出さない
// ============================================================
const installHintText = (() => {
    const ua = navigator.userAgent || '';
    const isIOS = /iPhone|iPad|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS
    const standalone = window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: fullscreen)').matches;
    if (!isIOS || standalone) return '';
    // LINEなどのアプリ内ブラウザでは「ホーム画面に追加」が使えないため案内を変える
    if (/Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(ua)) {
        return 'Safariで開いてから「ホーム画面に追加」すると、全画面で遊べます';
    }
    return '共有ボタン →「ホーム画面に追加」から起動すると、全画面で遊べます';
})();
document.querySelectorAll('.install-hint-text').forEach(el => { el.textContent = installHintText; });
document.getElementById('rotate-hint').classList.toggle('hidden', !installHintText);

// ============================================================
//  定数
// ============================================================
// 表示範囲：高さ600を基準に、中央エリアの縦横比に合わせて幅を可変にする
const BASE_VIEW_H = 600;
let VIEW_WIDTH = 800;
let VIEW_HEIGHT = 600;
let renderScale = 1;

// ワールドは元のまま（800x600の3倍）
const WORLD_WIDTH = 800 * 3;
const WORLD_HEIGHT = 600 * 3;
const TILE_SIZE = 40;

// Physics Constants（元のまま）
const GRAVITY = 0.15;
const THRUST = 0.35;
const MAX_FALL_SPEED = 8;
const MAX_FLY_SPEED = 6;
const FRICTION = 0.95;

const MAX_FUEL = 100;
const FUEL_CONSUMPTION_RATE = 0.085;
const TOTAL_COINS = 10;

// Game State
let gameState = 'START'; // START / PLAYING / PAUSED / GAMEOVER / STAGE_CLEAR
let collectedCoins = 0;
let warningMessageTimer = 0;
let currentStage = 1;

// 入力（キーボードとタッチを合成した最終状態）
const keys = { ArrowLeft: false, ArrowRight: false, Space: false };
const kbd  = { ArrowLeft: false, ArrowRight: false, Space: false };

// ============================================================
//  効果音（Web Audio APIで合成。音声ファイル不要）
// ============================================================
const Sound = (() => {
    const AC = window.AudioContext || window.webkitAudioContext;
    const VOL = 0.8;
    let ac = null, master = null, noiseBuf = null, jetGain = null, jetFilter = null;
    let jetOn = false, jetBoost = false;
    let muted = false;
    try { muted = localStorage.getItem('mrjetpack-muted') === '1'; } catch (e) {}

    // スマホは「ユーザー操作の中」で音声を有効化する必要がある
    function unlock() {
        if (!AC) return;
        try {
            if (!ac) {
                ac = new AC();
                master = ac.createGain();
                master.gain.value = muted ? 0 : VOL;
                const comp = ac.createDynamicsCompressor();
                master.connect(comp);
                comp.connect(ac.destination);

                // ホワイトノイズ（噴射音・衝突音の素材）
                noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
                const d = noiseBuf.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

                // 噴射音：ノイズをループ再生し、音量をON/OFFする
                const src = ac.createBufferSource();
                src.buffer = noiseBuf;
                src.loop = true;
                jetFilter = ac.createBiquadFilter();
                jetFilter.type = 'lowpass';
                jetFilter.frequency.value = 400;
                jetFilter.Q.value = 0.7;
                jetGain = ac.createGain();
                jetGain.gain.value = 0;
                src.connect(jetFilter);
                jetFilter.connect(jetGain);
                jetGain.connect(master);
                src.start();
            }
            if (ac.state === 'suspended') ac.resume();
        } catch (e) { /* 音が出ない環境でもゲームは続行 */ }
    }

    function tone(freq, dur, opt = {}) {
        if (!ac || muted) return;
        const { type = 'square', vol = 0.12, delay = 0, slide = 0 } = opt;
        const t = ac.currentTime + delay;
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        g.connect(master);
        o.start(t);
        o.stop(t + dur + 0.03);
    }

    function noise(dur, opt = {}) {
        if (!ac || muted) return;
        const { vol = 0.3, type = 'lowpass', freq = 800, to = 0, q = 1, delay = 0 } = opt;
        const t = ac.currentTime + delay;
        const s = ac.createBufferSource();
        const f = ac.createBiquadFilter();
        const g = ac.createGain();
        s.buffer = noiseBuf;
        f.type = type;
        f.Q.value = q;
        f.frequency.setValueAtTime(freq, t);
        if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f);
        f.connect(g);
        g.connect(master);
        s.start(t, Math.random() * 0.4);
        s.stop(t + dur + 0.03);
    }

    return {
        unlock,
        get muted() { return muted; },
        setMuted(m) {
            muted = m;
            try { localStorage.setItem('mrjetpack-muted', m ? '1' : '0'); } catch (e) {}
            if (master) master.gain.setTargetAtTime(m ? 0 : VOL, ac.currentTime, 0.02);
        },
        // 噴射音（押している間だけ鳴る。ダッシュ中は高く強く）
        jet(on, boost) {
            if (!ac || (on === jetOn && boost === jetBoost)) return;
            jetOn = on;
            jetBoost = boost;
            const t = ac.currentTime;
            jetGain.gain.setTargetAtTime(on ? (boost ? 0.5 : 0.32) : 0, t, on ? 0.02 : 0.06);
            jetFilter.frequency.setTargetAtTime(on ? (boost ? 1700 : 850) : 400, t, 0.05);
        },
        coin()   { tone(988, 0.07); tone(1319, 0.25, { delay: 0.07 }); },
        fuel()   { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, { type: 'triangle', vol: 0.22, delay: i * 0.05 })); },
        hit()    { noise(0.2, { vol: 0.55, freq: 500, to: 120 }); tone(170, 0.18, { vol: 0.14, slide: 60 }); },
        beep()   { tone(880, 0.08, { vol: 0.07 }); },
        buzzer() { tone(110, 0.32, { type: 'sawtooth', vol: 0.1 }); tone(117, 0.32, { type: 'sawtooth', vol: 0.1 }); },
        whoosh() { noise(0.4, { vol: 0.35, type: 'bandpass', freq: 400, to: 2600, q: 1.2 }); },
        start()  { tone(523, 0.08); tone(784, 0.08, { delay: 0.08 }); tone(1047, 0.16, { delay: 0.16 }); },
        clear()  {
            [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.1, { delay: i * 0.1 }));
            tone(1319, 0.5, { delay: 0.4, vol: 0.14 });
            tone(659, 0.5, { type: 'triangle', delay: 0.4, vol: 0.18 });
        },
        over()   {
            [494, 440, 392, 330].forEach((f, i) => tone(f, 0.18, { delay: i * 0.17 }));
            tone(262, 0.7, { delay: 0.7, slide: 110, vol: 0.13 });
        },
        ui()     { tone(1200, 0.04, { vol: 0.06 }); }
    };
})();

// 振動（Androidのみ対応。iPhoneでは何もしない）
function buzz(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
}

// ============================================================
//  プレイヤー（元コードのまま＋効果音・振動を追加）
// ============================================================
class Player {
    constructor() {
        this.width = 29;
        this.height = 51;
        this.reset();
    }

    reset() {
        this.x = TILE_SIZE * 3 + (TILE_SIZE - this.width) / 2;
        this.y = WORLD_HEIGHT - TILE_SIZE * 4 - this.height;
        this.vx = 0;
        this.vy = 0;
        this.facingRight = true;
        this.fuel = MAX_FUEL;
        this.isThrusting = false;

        this.dashPressTime = 0;
        this.isDashing = false;
        this.dashDirection = 0;
        this.flashTimer = 0;
    }

    update() {
        if (gameState !== 'PLAYING') return;

        if (this.flashTimer > 0) this.flashTimer--;

        this.isThrusting = false;
        this.vy += GRAVITY;

        const now = Date.now();
        const DASH_THRESHOLD = 1000;

        if (keys.ArrowRight) {
            if (this.dashDirection !== 1) {
                this.dashDirection = 1;
                this.dashPressTime = now;
                this.isDashing = false;
            } else if (now - this.dashPressTime >= DASH_THRESHOLD) {
                this.isDashing = true;
            }
        } else if (keys.ArrowLeft) {
            if (this.dashDirection !== -1) {
                this.dashDirection = -1;
                this.dashPressTime = now;
                this.isDashing = false;
            } else if (now - this.dashPressTime >= DASH_THRESHOLD) {
                this.isDashing = true;
            }
        } else {
            this.dashDirection = 0;
            this.isDashing = false;
        }

        let currentThrust = THRUST;
        let currentMaxFlySpeed = MAX_FLY_SPEED;

        if (this.isDashing) {
            currentThrust = THRUST * 2.0;
            currentMaxFlySpeed = MAX_FLY_SPEED * 2.0;
        }

        if (this.fuel > 0 && keys.Space) {
            this.isThrusting = true;
            this.fuel -= FUEL_CONSUMPTION_RATE;
            if (this.fuel < 0) this.fuel = 0;

            if (keys.ArrowLeft) {
                this.vx -= currentThrust * 0.7;
                this.vy -= currentThrust * 0.7;
                this.facingRight = false;
            } else if (keys.ArrowRight) {
                this.vx += currentThrust * 0.7;
                this.vy -= currentThrust * 0.7;
                this.facingRight = true;
            } else {
                this.vy -= currentThrust;
            }
        } else {
            if (keys.ArrowLeft) this.facingRight = false;
            if (keys.ArrowRight) this.facingRight = true;
        }

        this.vx *= FRICTION;
        this.vy *= 0.99;

        if (this.vy > MAX_FALL_SPEED) this.vy = MAX_FALL_SPEED;
        if (this.vy < -currentMaxFlySpeed) this.vy = -currentMaxFlySpeed;
        if (this.vx > currentMaxFlySpeed) this.vx = currentMaxFlySpeed;
        if (this.vx < -currentMaxFlySpeed) this.vx = -currentMaxFlySpeed;

        this.handleCollisions(this.x + this.vx, this.y + this.vy);
        this.checkFuel();
    }

    onWallCollision() {
        if (this.flashTimer <= 0) {
            this.fuel -= MAX_FUEL * 0.1;
            if (this.fuel < 0) this.fuel = 0;
            this.flashTimer = 20;
            Sound.hit();
            buzz(40);
        }
    }

    handleCollisions(nextX, nextY) {
        let collided = false;

        // Horizontal Collision
        this.x = nextX;
        let pColLeft = Math.floor(this.x / TILE_SIZE);
        let pColRight = Math.floor((this.x + this.width) / TILE_SIZE);
        let pRowTop = Math.floor(this.y / TILE_SIZE);
        let pRowBottom = Math.floor((this.y + this.height - 1) / TILE_SIZE);

        if (this.vx > 0) {
            if (world.isSolid(pColRight, pRowTop) || world.isSolid(pColRight, pRowBottom)) {
                this.x = pColRight * TILE_SIZE - this.width - 0.1;
                this.vx = 0;
                if (Math.abs(this.vx) > 0.5 || this.isThrusting) collided = true;
            }
        } else if (this.vx < 0) {
            if (world.isSolid(pColLeft, pRowTop) || world.isSolid(pColLeft, pRowBottom)) {
                this.x = (pColLeft + 1) * TILE_SIZE + 0.1;
                this.vx = 0;
                if (Math.abs(this.vx) > 0.5 || this.isThrusting) collided = true;
            }
        }

        // Vertical Collision
        this.y = nextY;
        pColLeft = Math.floor(this.x / TILE_SIZE);
        pColRight = Math.floor((this.x + this.width - 1) / TILE_SIZE);
        pRowTop = Math.floor(this.y / TILE_SIZE);
        pRowBottom = Math.floor((this.y + this.height) / TILE_SIZE);

        if (this.vy > 0) {
            if (world.isSolid(pColLeft, pRowBottom) || world.isSolid(pColRight, pRowBottom)) {
                this.y = pRowBottom * TILE_SIZE - this.height;
                if (this.vy > 3.0) collided = true;
                this.vy = 0;
            }
        } else if (this.vy < 0) {
            if (world.isSolid(pColLeft, pRowTop) || world.isSolid(pColRight, pRowTop)) {
                this.y = (pRowTop + 1) * TILE_SIZE + 0.1;
                this.vy = 0;
                collided = true;
            }
        }

        if (collided) this.onWallCollision();

        if (this.x < 0) { this.x = 0; this.vx = 0; }
        if (this.x + this.width > WORLD_WIDTH) { this.x = WORLD_WIDTH - this.width; this.vx = 0; }
        if (this.y < 0) { this.y = 0; this.vy = 0; }
        if (this.y + this.height > WORLD_HEIGHT) { this.y = WORLD_HEIGHT - this.height; this.vy = 0; }
    }

    checkFuel() {
        if (this.fuel <= 0 && gameState === 'PLAYING') {
            setGameOver("OUT OF FUEL...");
        }
    }

    draw(ctx, camX, camY) {
        const drawX = this.x - camX;
        const drawY = this.y - camY;
        const s = 1.5;

        ctx.save();
        ctx.translate(drawX, drawY);

        if (!this.facingRight) {
            ctx.translate(this.width, 0);
            ctx.scale(-1, 1);
        }

        if (this.isDashing && this.isThrusting) {
            ctx.translate(this.width / 2, this.height / 2);
            ctx.rotate(20 * Math.PI / 180);
            ctx.translate(-this.width / 2, -this.height / 2);
        }

        const isFlashing = (this.flashTimer > 0 && Math.floor(this.flashTimer / 3) % 2 === 0);

        // --- Jetpack ---
        ctx.fillStyle = isFlashing ? '#FFFFFF' : '#C0C0C0';
        ctx.fillRect(0, 10*s, 5*s, 14*s);
        ctx.fillStyle = isFlashing ? '#FFFFFF' : '#808080';
        ctx.fillRect(0, 24*s, 5*s, 4*s);
        ctx.fillStyle = isFlashing ? '#FFFFFF' : '#C00000';
        ctx.fillRect(1*s, 8*s, 4*s, 2*s);
        ctx.fillRect(2*s, 6*s, 2*s, 2*s);

        const fuelRatio = this.fuel / MAX_FUEL;
        ctx.fillStyle = '#FFDAB9';
        ctx.fillRect(1.5*s, 12*s, 2*s, 10*s);

        if (fuelRatio > 0) {
            if (fuelRatio > 0.75) { ctx.fillStyle = '#FFE4E1'; ctx.fillRect(1.5*s, 12*s, 2*s, 2.5*s); }
            if (fuelRatio > 0.5)  { ctx.fillStyle = '#FFDAB9'; ctx.fillRect(1.5*s, 14.5*s, 2*s, 2.5*s); }
            if (fuelRatio > 0.25) { ctx.fillStyle = '#F4A460'; ctx.fillRect(1.5*s, 17*s, 2*s, 2.5*s); }
            ctx.fillStyle = '#D2691E';
            ctx.fillRect(1.5*s, 19.5*s, 2*s, 2.5*s);
        }

        // --- Body ---
        ctx.fillStyle = isFlashing ? '#FFFFFF' : '#A0C8F0';
        ctx.fillRect(5*s, 20*s, 3*s, 8*s);

        ctx.fillStyle = isFlashing ? '#FFFFFF' : '#0066CC';
        ctx.fillRect(8*s, 3*s, 4*s, 3*s);
        ctx.fillRect(6*s, 6*s, 6*s, 4*s);
        ctx.fillRect(5*s, 10*s, 9*s, 18*s);
        ctx.fillRect(14*s, 10*s, 2*s, 14*s);
        ctx.fillRect(12*s, 6*s, 5*s, 4*s);

        ctx.fillStyle = isFlashing ? '#FFFFFF' : '#204070';
        ctx.fillRect(6.5*s, 13*s, 2.5*s, 6*s);
        ctx.fillRect(8*s, 17*s, 6*s, 2*s);
        ctx.fillStyle = isFlashing ? '#FFFFFF' : '#336699';
        ctx.fillRect(7*s, 19*s, 6*s, 2*s);
        ctx.fillRect(12.5*s, 17*s, 1.5*s, 2*s);

        // --- Visor ---
        ctx.fillStyle = isFlashing ? '#FFFFFF' : '#000000';
        ctx.fillRect(12.5*s, 3.5*s, 6.5*s, 4*s);
        ctx.fillStyle = isFlashing ? '#FFFFFF' : '#00FFFF';
        ctx.fillRect(13*s, 4.5*s, 5.5*s, 1.5*s);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(13.5*s, 4.5*s, 2*s, 0.5*s);

        // --- Hand ---
        ctx.fillStyle = isFlashing ? '#FFFFFF' : '#C0C0C0';
        ctx.fillRect(14*s, 15*s, 4*s, 2*s);

        // --- Legs ---
        ctx.fillStyle = isFlashing ? '#FFFFFF' : '#A0A0A0';
        ctx.fillRect(10*s, 28*s, 2.5*s, 4*s);
        ctx.fillRect(12.5*s, 30*s, 1.5*s, 2*s);
        ctx.fillStyle = isFlashing ? '#FFFFFF' : '#FFCC00';
        ctx.fillRect(10*s, 32*s, 5*s, 2*s);

        if (this.isThrusting) {
            ctx.fillStyle = '#FFA500';
            ctx.beginPath();
            ctx.moveTo(1*s, 28*s);
            ctx.lineTo(4*s, 28*s);
            ctx.lineTo(2.5*s, 28*s + 4*s + Math.random() * 4*s);
            ctx.fill();

            ctx.fillStyle = '#FFFF00';
            ctx.beginPath();
            ctx.moveTo(2*s, 28*s);
            ctx.lineTo(3*s, 28*s);
            ctx.lineTo(2.5*s, 28*s + 2*s + Math.random() * 2*s);
            ctx.fill();
        }

        ctx.restore();
    }
}

// ============================================================
//  ワールド（元コードのまま＋効果音を追加）
// ============================================================
class World {
    constructor() {
        this.cols = WORLD_WIDTH / TILE_SIZE;
        this.rows = WORLD_HEIGHT / TILE_SIZE;
        this.grid = [];
        this.generateRandomMap();

        this.goalX = (this.cols - 8) * TILE_SIZE;
        this.goalY = 4 * TILE_SIZE;
        this.goalWidth = TILE_SIZE;
        this.goalHeight = TILE_SIZE * 2;
        this.atGoal = false;

        this.coins = [];
        this.initCoins();

        this.fuelTanks = [];
        this.initFuelTanks();
    }

    initCoins() {
        this.coins = [];
        let placed = 0;
        let attempts = 0;
        while (placed < TOTAL_COINS && attempts < 1000) {
            const r = Math.floor(Math.random() * (this.rows - 4)) + 2;
            const c = Math.floor(Math.random() * (this.cols - 4)) + 2;
            if (this.grid[r][c] === 0) {
                this.coins.push({
                    x: c * TILE_SIZE + TILE_SIZE / 2,
                    y: r * TILE_SIZE + TILE_SIZE / 2,
                    radius: 12,
                    collected: false
                });
                placed++;
            }
            attempts++;
        }
    }

    initFuelTanks() {
        this.fuelTanks = [];
        let placed = 0;
        let attempts = 0;
        while (placed < 3 && attempts < 1000) {
            const r = Math.floor(Math.random() * (this.rows - 4)) + 2;
            const c = Math.floor(Math.random() * (this.cols - 4)) + 2;
            if (this.grid[r][c] === 0) {
                this.fuelTanks.push({
                    x: c * TILE_SIZE + TILE_SIZE / 2,
                    y: r * TILE_SIZE + TILE_SIZE / 2,
                    width: 16,
                    height: 24,
                    collected: false
                });
                placed++;
            }
            attempts++;
        }
    }

    checkCoins(player) {
        const px = player.x + player.width / 2;
        const py = player.y + player.height / 2;
        this.coins.forEach(coin => {
            if (!coin.collected) {
                const dx = px - coin.x;
                const dy = py - coin.y;
                if (Math.sqrt(dx * dx + dy * dy) < coin.radius + 15) {
                    coin.collected = true;
                    collectedCoins++;
                    Sound.coin();
                }
            }
        });
    }

    checkFuelTanks(player) {
        const px = player.x + player.width / 2;
        const py = player.y + player.height / 2;
        this.fuelTanks.forEach(tank => {
            if (!tank.collected) {
                const dx = px - tank.x;
                const dy = py - tank.y;
                if (Math.sqrt(dx * dx + dy * dy) < (tank.width / 2) + 20) {
                    tank.collected = true;
                    player.fuel += MAX_FUEL * 0.35;
                    if (player.fuel > MAX_FUEL) player.fuel = MAX_FUEL;
                    Sound.fuel();
                }
            }
        });
    }

    generateRandomMap() {
        for (let r = 0; r < this.rows; r++) {
            this.grid[r] = [];
            for (let c = 0; c < this.cols; c++) this.grid[r][c] = 1;
        }

        const digCircle = (cx, cy, radius) => {
            for (let r = Math.max(1, Math.floor(cy - radius)); r <= Math.min(this.rows - 2, Math.ceil(cy + radius)); r++) {
                for (let c = Math.max(1, Math.floor(cx - radius)); c <= Math.min(this.cols - 2, Math.ceil(cx + radius)); c++) {
                    const dx = c - cx;
                    const dy = r - cy;
                    if (dx * dx + dy * dy <= radius * radius) this.grid[r][c] = 0;
                }
            }
        };

        const digLine = (x0, y0, x1, y1, radius) => {
            const dx = Math.abs(x1 - x0);
            const dy = Math.abs(y1 - y0);
            const sx = (x0 < x1) ? 1 : -1;
            const sy = (y0 < y1) ? 1 : -1;
            let err = dx - dy;
            while (true) {
                digCircle(x0, y0, radius);
                if (x0 === x1 && y0 === y1) break;
                const e2 = 2 * err;
                if (e2 > -dy) { err -= dy; x0 += sx; }
                if (e2 < dx) { err += dx; y0 += sy; }
            }
        };

        const startPoint = { x: 4, y: this.rows - 6 };
        const endPoint = { x: this.cols - 6, y: 5 };

        const waypoints = [startPoint];
        const numWaypoints = Math.floor(Math.random() * 3) + 2;

        for (let i = 1; i <= numWaypoints; i++) {
            const p = i / (numWaypoints + 1);
            const bx = startPoint.x + (endPoint.x - startPoint.x) * p;
            const by = startPoint.y + (endPoint.y - startPoint.y) * p;
            let rx = bx + (Math.random() - 0.5) * 20;
            let ry = by + (Math.random() - 0.5) * 20;
            rx = Math.max(5, Math.min(this.cols - 6, rx));
            ry = Math.max(5, Math.min(this.rows - 6, ry));
            waypoints.push({ x: Math.floor(rx), y: Math.floor(ry) });
        }
        waypoints.push(endPoint);

        const pathRadius = 4;
        for (let i = 0; i < waypoints.length - 1; i++) {
            digLine(waypoints[i].x, waypoints[i].y, waypoints[i + 1].x, waypoints[i + 1].y, pathRadius);
        }

        const numSubPaths = 6 + Math.floor(Math.random() * 5);
        for (let i = 0; i < numSubPaths; i++) {
            const p1 = waypoints[Math.floor(Math.random() * waypoints.length)];
            const angle = Math.random() * Math.PI * 2;
            const dist = 10 + Math.random() * 15;
            let p2x = Math.floor(p1.x + Math.cos(angle) * dist);
            let p2y = Math.floor(p1.y + Math.sin(angle) * dist);
            p2x = Math.max(5, Math.min(this.cols - 6, p2x));
            p2y = Math.max(5, Math.min(this.rows - 6, p2y));
            digLine(p1.x, p1.y, p2x, p2y, Math.floor(pathRadius * 0.8));
            if (Math.random() < 0.5) {
                const p3 = waypoints[Math.floor(Math.random() * waypoints.length)];
                digLine(p2x, p2y, p3.x, p3.y, Math.floor(pathRadius * 0.8));
            }
        }

        digCircle(startPoint.x, startPoint.y, 6);
        digCircle(endPoint.x, endPoint.y, 6);

        for (let r = this.rows - 4; r < this.rows - 1; r++) {
            for (let c = 2; c < 5; c++) this.grid[r][c] = 1;
        }
    }

    isSolid(col, row) {
        if (col < 0 || col >= this.cols || row < 0 || row >= this.rows) return true;
        return this.grid[row][col] === 1;
    }

    checkGoal(player) {
        const inside =
            player.x < this.goalX + this.goalWidth &&
            player.x + player.width > this.goalX &&
            player.y < this.goalY + this.goalHeight &&
            player.y + player.height > this.goalY;

        if (inside) {
            if (collectedCoins >= TOTAL_COINS) {
                setGoal();
            } else {
                if (!this.atGoal) Sound.buzzer();   // 旗に触れた瞬間だけ鳴らす
                warningMessageTimer = 90;           // スマホで読めるよう約1.5秒残す
            }
        }
        this.atGoal = inside;
    }

    draw(ctx, camX, camY) {
        const startCol = Math.max(0, Math.floor(camX / TILE_SIZE));
        const endCol = Math.min(this.cols, Math.ceil((camX + VIEW_WIDTH) / TILE_SIZE));
        const startRow = Math.max(0, Math.floor(camY / TILE_SIZE));
        const endRow = Math.min(this.rows, Math.ceil((camY + VIEW_HEIGHT) / TILE_SIZE));

        for (let r = startRow; r < endRow; r++) {
            for (let c = startCol; c < endCol; c++) {
                if (this.grid[r][c] === 1) {
                    if (c >= 2 && c < 5 && r >= this.rows - 4 && r < this.rows - 1) continue;
                    const x = c * TILE_SIZE - camX;
                    const y = r * TILE_SIZE - camY;
                    ctx.fillStyle = '#555';
                    // +1 で隣のタイルと重ね、拡大縮小時のすき間線を防ぐ
                    ctx.fillRect(x, y, TILE_SIZE + 1, TILE_SIZE + 1);
                    ctx.fillStyle = '#333';
                    ctx.fillRect(x + 5, y + 5, TILE_SIZE - 10, TILE_SIZE - 10);
                }
            }
        }

        // --- 専用スタート足場 ---
        const pX = TILE_SIZE * 2 - camX;
        const pY = (this.rows - 4) * TILE_SIZE - camY;
        const pW = TILE_SIZE * 3;
        const pH = TILE_SIZE * 3;

        if (pX > -pW && pX < VIEW_WIDTH && pY > -pH && pY < VIEW_HEIGHT) {
            ctx.fillStyle = '#222';
            ctx.fillRect(pX + 10, pY + 15, pW - 20, pH - 15);

            ctx.strokeStyle = '#444';
            ctx.lineWidth = 4;
            ctx.beginPath();
            const trussW = pW - 20;
            const trussH = pH - 15;
            const tCols = 3;
            const tRows = 3;
            for (let i = 0; i < tCols; i++) {
                const cellX = pX + 10 + i * (trussW / tCols);
                const nextX = cellX + (trussW / tCols);
                for (let j = 0; j < tRows; j++) {
                    const cellY = pY + 15 + j * (trussH / tRows);
                    const nextY = cellY + (trussH / tRows);
                    ctx.moveTo(cellX, cellY);
                    ctx.lineTo(nextX, nextY);
                    ctx.moveTo(nextX, cellY);
                    ctx.lineTo(cellX, nextY);
                }
            }
            for (let i = 0; i <= tCols; i++) {
                const lx = pX + 10 + i * (trussW / tCols);
                ctx.moveTo(lx, pY + 15);
                ctx.lineTo(lx, pY + pH);
            }
            for (let j = 0; j <= tRows; j++) {
                const ly = pY + 15 + j * (trussH / tRows);
                ctx.moveTo(pX + 10, ly);
                ctx.lineTo(pX + 10 + trussW, ly);
            }
            ctx.stroke();
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 2;
            ctx.stroke();

            const topH = 15;
            ctx.save();
            ctx.translate(pX, pY);
            ctx.beginPath();
            ctx.rect(0, 0, pW, topH);
            ctx.clip();
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, pW, topH);
            ctx.fillStyle = '#FFCC00';
            for (let i = -topH; i < pW; i += 20) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i + 10, 0);
                ctx.lineTo(i + 10 - topH, topH);
                ctx.lineTo(i - topH, topH);
                ctx.fill();
            }
            ctx.restore();

            ctx.fillStyle = '#444';
            ctx.fillRect(pX, pY + pH - 10, pW, 10);
            ctx.fillStyle = '#222';
            ctx.fillRect(pX + 2, pY + pH - 8, pW - 4, 6);
        }

        this.coins.forEach(coin => {
            if (coin.collected) return;
            const cx = coin.x - camX;
            const cy = coin.y - camY;
            if (cx > -coin.radius && cx < VIEW_WIDTH + coin.radius &&
                cy > -coin.radius && cy < VIEW_HEIGHT + coin.radius) {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(cx, cy, coin.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#DAA520';
                ctx.beginPath();
                ctx.arc(cx, cy, coin.radius * 0.6, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        this.fuelTanks.forEach(tank => {
            if (tank.collected) return;
            const tx = tank.x - camX - tank.width / 2;
            const ty = tank.y - camY - tank.height / 2;
            if (tx > -tank.width && tx < VIEW_WIDTH && ty > -tank.height && ty < VIEW_HEIGHT) {
                ctx.fillStyle = '#888';
                ctx.fillRect(tx + 6, ty - 2, 4, 2);
                ctx.fillStyle = '#AAA';
                ctx.fillRect(tx + 4, ty, 8, 4);
                ctx.fillStyle = '#E00';
                ctx.fillRect(tx + 2, ty + 4, 12, 16);
                ctx.fillStyle = '#FD0';
                ctx.fillRect(tx + 2, ty + 10, 12, 4);
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(tx + 8, ty + 4, 6, 16);
            }
        });

        const gX = this.goalX - camX;
        const gY = this.goalY - camY;
        if (gX > -TILE_SIZE && gX < VIEW_WIDTH && gY > -TILE_SIZE * 2 && gY < VIEW_HEIGHT) {
            ctx.fillStyle = '#ccc';
            ctx.fillRect(gX + 5, gY, 4, this.goalHeight);
            ctx.fillStyle = '#f00';
            ctx.beginPath();
            ctx.moveTo(gX + 9, gY + 5);
            ctx.lineTo(gX + TILE_SIZE, gY + 15);
            ctx.lineTo(gX + 9, gY + 25);
            ctx.fill();
        }
    }
}

const player = new Player();
const world = new World();
const camera = { x: 0, y: 0 };

// ============================================================
//  カメラ
// ============================================================
function clampCamera() {
    camera.x = Math.max(0, Math.min(WORLD_WIDTH - VIEW_WIDTH, camera.x));
    camera.y = Math.max(0, Math.min(WORLD_HEIGHT - VIEW_HEIGHT, camera.y));
}
function snapCamera() {
    camera.x = player.x + player.width / 2 - VIEW_WIDTH / 2;
    camera.y = player.y + player.height / 2 - VIEW_HEIGHT / 2;
    clampCamera();
}
function updateCamera() {
    const targetCamX = player.x + player.width / 2 - VIEW_WIDTH / 2;
    const targetCamY = player.y + player.height / 2 - VIEW_HEIGHT / 2;
    camera.x += (targetCamX - camera.x) * 0.1;
    camera.y += (targetCamY - camera.y) * 0.1;
    clampCamera();
}

// ============================================================
//  左パネルのステータス表示（値が変わったときだけ書き換え）
// ============================================================
const hudCache = { fuel: -1, level: '', coins: -1, stage: -1 };
function updateHud() {
    const pct = Math.max(0, Math.round((player.fuel / MAX_FUEL) * 200) / 2);
    if (pct !== hudCache.fuel) {
        hudCache.fuel = pct;
        fuelBar.style.width = pct + '%';
        const level = pct < 20 ? 'crit' : pct <= 30 ? 'low' : pct <= 60 ? 'mid' : '';
        if (level !== hudCache.level) {
            fuelBar.className = level;
            hudCache.level = level;
        }
    }
    if (collectedCoins !== hudCache.coins) {
        hudCache.coins = collectedCoins;
        hudCoins.textContent = `${collectedCoins}/${TOTAL_COINS}`;
    }
    if (currentStage !== hudCache.stage) {
        hudCache.stage = currentStage;
        hudStage.textContent = currentStage;
    }
}

// ============================================================
//  ミニマップ（右パネル）：壁は1ステージに1回だけ描いておく
// ============================================================
const miniLayer = document.createElement('canvas');
function resizeMinimap() {
    const r = mapWrap.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    miniCanvas.width = Math.max(1, Math.round(Math.floor(r.width) * dpr));
    miniCanvas.height = Math.max(1, Math.round(Math.floor(r.height) * dpr));
    buildMinimapLayer();
}
function buildMinimapLayer() {
    miniLayer.width = miniCanvas.width;
    miniLayer.height = miniCanvas.height;
    const c = miniLayer.getContext('2d');
    c.fillStyle = '#07090c';
    c.fillRect(0, 0, miniLayer.width, miniLayer.height);
    const tw = miniLayer.width / world.cols;
    const th = miniLayer.height / world.rows;
    c.fillStyle = '#4a4f57';
    for (let r = 0; r < world.rows; r++) {
        for (let col = 0; col < world.cols; col++) {
            if (world.grid[r][col] === 1) c.fillRect(col * tw, r * th, tw + 0.6, th + 0.6);
        }
    }
}
function drawMinimap() {
    const W = miniCanvas.width, H = miniCanvas.height;
    if (gameState === 'START') {
        miniCtx.fillStyle = '#07090c';
        miniCtx.fillRect(0, 0, W, H);
        return;
    }
    miniCtx.drawImage(miniLayer, 0, 0);
    const sx = W / WORLD_WIDTH, sy = H / WORLD_HEIGHT;

    // いま見えている範囲
    miniCtx.strokeStyle = 'rgba(255,255,255,0.5)';
    miniCtx.lineWidth = Math.max(1, W / 160);
    miniCtx.strokeRect(camera.x * sx, camera.y * sy, VIEW_WIDTH * sx, VIEW_HEIGHT * sy);

    // ゴール
    miniCtx.fillStyle = '#ff2a2a';
    miniCtx.fillRect(world.goalX * sx, world.goalY * sy,
        Math.max(2, world.goalWidth * sx), world.goalHeight * sy);

    // 未取得コイン
    const cr = Math.max(1.5, W / 75);
    miniCtx.fillStyle = '#FFD700';
    world.coins.forEach(coin => {
        if (coin.collected) return;
        miniCtx.beginPath();
        miniCtx.arc(coin.x * sx, coin.y * sy, cr, 0, Math.PI * 2);
        miniCtx.fill();
    });

    // プレイヤー
    miniCtx.fillStyle = '#00FFFF';
    miniCtx.beginPath();
    miniCtx.arc((player.x + player.width / 2) * sx, (player.y + player.height / 2) * sy, cr * 1.5, 0, Math.PI * 2);
    miniCtx.fill();
}

// ============================================================
//  画面の状態遷移
// ============================================================
function showOverlay({ title, color, message = '', button, legend = false, hint = false }) {
    mainTitle.textContent = title;
    mainTitle.style.color = color;
    gameMessage.textContent = message;
    actionButton.textContent = button;
    legendEl.classList.toggle('hidden', !legend);
    installHint.classList.toggle('hidden', !(hint && installHintText));
    messageOverlay.classList.remove('hidden');
}
function hideOverlay() {
    messageOverlay.classList.add('hidden');
}

function startStage() {
    world.generateRandomMap();
    player.reset();
    world.initCoins();
    world.initFuelTanks();
    world.atGoal = false;
    collectedCoins = 0;
    warningMessageTimer = 0;
    lowFuelTimer = 0;
    buildMinimapLayer();
    snapCamera();
    gameState = 'PLAYING';
    hideOverlay();
    updatePauseIcon();
}

function setGameOver(reason) {
    gameState = 'GAMEOVER';
    Sound.over();
    buzz([60, 60, 120]);
    showOverlay({ title: 'GAME OVER', color: '#f00', message: reason, button: 'RESTART (STAGE 1)' });
    updatePauseIcon();
}

function setGoal() {
    gameState = 'STAGE_CLEAR';
    Sound.clear();
    showOverlay({ title: 'STAGE CLEAR!', color: '#0f0', message: 'ALL COINS COLLECTED!', button: 'NEXT STAGE' });
    updatePauseIcon();
}

function pauseGame() {
    if (gameState !== 'PLAYING') return;
    gameState = 'PAUSED';
    showOverlay({ title: 'PAUSE', color: '#fff', message: '', button: 'RESUME', legend: true });
    updatePauseIcon();
}
function resumeGame() {
    if (gameState !== 'PAUSED') return;
    gameState = 'PLAYING';
    player.dashPressTime = Date.now(); // 一時停止中の時間をダッシュ判定に含めない
    hideOverlay();
    updatePauseIcon();
}
function togglePause() {
    if (gameState === 'PLAYING') pauseGame();
    else if (gameState === 'PAUSED') resumeGame();
}
function updatePauseIcon() {
    const paused = gameState === 'PAUSED';
    document.getElementById('ico-pause').style.display = paused ? 'none' : '';
    document.getElementById('ico-play').style.display = paused ? '' : 'none';
    btnPause.setAttribute('aria-label', paused ? '再開' : '一時停止');
}
function updateSoundIcon() {
    const m = Sound.muted;
    document.getElementById('snd-on').style.display = m ? 'none' : '';
    document.getElementById('snd-off').style.display = m ? '' : 'none';
    btnSound.setAttribute('aria-pressed', String(!m));
}

// ============================================================
//  ゲームループ（60回/秒の固定ステップ）
//  ※元版は描画1回＝物理1回だったため、120Hz画面のスマホでは2倍速になっていた
// ============================================================
const STEP = 1000 / 60;
let acc = 0;
let lastTs = 0;
let lowFuelTimer = 0;
let wasBoosting = false;

function tick() {
    if (gameState === 'PLAYING') {
        player.update();
        world.checkCoins(player);
        world.checkFuelTanks(player);
        world.checkGoal(player);
        if (warningMessageTimer > 0) warningMessageTimer--;

        // 燃料20%未満で警告音
        if (gameState === 'PLAYING' && player.fuel < MAX_FUEL * 0.2) {
            if (--lowFuelTimer <= 0) { Sound.beep(); lowFuelTimer = 40; }
        } else {
            lowFuelTimer = 0;
        }
    }
    updateCamera();
}

function setClass(el, cls, on) {
    if (el.classList.contains(cls) !== on) el.classList.toggle(cls, on);
}

function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);

    // カメラを実画素単位にそろえてチラつきを抑える
    const camX = Math.round(camera.x * renderScale) / renderScale;
    const camY = Math.round(camera.y * renderScale) / renderScale;

    world.draw(ctx, camX, camY);
    player.draw(ctx, camX, camY);

    if (warningMessageTimer > 0 && gameState === 'PLAYING') {
        ctx.font = '30px "DotGothic16", "Press Start 2P", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#000';
        ctx.strokeText('コインが足りません！', VIEW_WIDTH / 2, VIEW_HEIGHT / 4);
        ctx.fillStyle = '#FF3333';
        ctx.fillText('コインが足りません！', VIEW_WIDTH / 2, VIEW_HEIGHT / 4);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
    }

    drawMinimap();
    updateHud();

    const playing = gameState === 'PLAYING';
    const boosting = playing && player.isDashing && player.isThrusting;
    if (boosting && !wasBoosting) Sound.whoosh();
    wasBoosting = boosting;
    Sound.jet(playing && player.isThrusting, boosting);

    setClass(stickEl, 'dash', playing && player.isDashing);
}

function frame(ts) {
    if (!lastTs) lastTs = ts;
    let dt = ts - lastTs;
    lastTs = ts;
    if (dt > 250) dt = 250;
    acc += dt;
    let n = 0;
    while (acc >= STEP * 0.9 && n < 6) {
        tick();
        acc -= STEP;
        n++;
    }
    if (n >= 6) acc = 0;
    render();
    requestAnimationFrame(frame);
}

// ============================================================
//  タッチ操作
//  ・指ごとに「最初に触れたボタン」を記憶し、指がずれても離すまで有効
//  ・左パネルは ◀ と ▶ の間を指を離さずスライドして切り替えられる
//  ・複数の指（方向＋ジェット）の同時押しに対応
// ============================================================
const pointers = new Map(); // 指ID → { zone: 'dir' | 'jet', x, y, seq }
let pointerSeq = 0;
let zones = null;

function measureZones() {
    const lp = leftPanel.getBoundingClientRect();
    const dp = dpadEl.getBoundingClientRect();
    const st = stickEl.getBoundingClientRect();
    const rp = rightPanel.getBoundingClientRect();
    const jz = jetZoneEl.getBoundingClientRect();
    const W = window.innerWidth, H = window.innerHeight;
    zones = {
        // 画面の左端（セーフエリア部分）まで判定を広げる
        // mid＝レバーの支点、travel＝倒しきる距離、dead＝反応しない中央の幅
        dir: { l: -10, r: lp.right, t: dp.top - 8, b: H + 10,
               mid: st.left + st.width / 2, travel: st.width * 0.42, dead: st.width * 0.08 },
        jet: { l: rp.left, r: W + 10, t: jz.top - 8, b: H + 10 }
    };
}
function zoneAt(x, y) {
    if (!zones) measureZones();
    const d = zones.dir, j = zones.jet;
    if (x >= d.l && x <= d.r && y >= d.t && y <= d.b) return 'dir';
    if (x >= j.l && x <= j.r && y >= j.t && y <= j.b) return 'jet';
    return null;
}

const STICK_MAX_DEG = 30;
let lastTilt = null;
let lastDragging = null;
function setStickTilt(t, dragging) {
    const deg = Math.round(t * STICK_MAX_DEG * 10) / 10;
    if (dragging !== lastDragging) {
        setClass(stickEl, 'dragging', dragging);
        lastDragging = dragging;
    }
    if (deg !== lastTilt) {
        stickEl.style.setProperty('--tilt', deg + 'deg');
        lastTilt = deg;
    }
}

function recomputeInput() {
    let jet = false;
    let dirP = null;
    pointers.forEach(p => {
        if (p.zone === 'jet') jet = true;
        else if (p.zone === 'dir' && (!dirP || p.seq > dirP.seq)) dirP = p;
    });

    // レバー：支点からの指の横位置で判定（中央付近は無反応）
    let tl = false, tr = false, tilt = 0;
    if (dirP) {
        const d = zones.dir;
        const dx = dirP.x - d.mid;
        tilt = Math.max(-1, Math.min(1, dx / d.travel));
        if (dx < -d.dead) tl = true;
        else if (dx > d.dead) tr = true;
    }
    keys.ArrowLeft = kbd.ArrowLeft || tl;
    keys.ArrowRight = kbd.ArrowRight || tr;
    keys.Space = kbd.Space || jet;

    // キーボード操作のときもレバーを倒して見せる
    if (!dirP) tilt = keys.ArrowRight ? 1 : keys.ArrowLeft ? -1 : 0;
    setStickTilt(tilt, !!dirP);
    setClass(stickEl, 'left', keys.ArrowLeft && !keys.ArrowRight);
    setClass(stickEl, 'right', keys.ArrowRight);
    setClass(btnJet, 'on', keys.Space);
}

// touchend を取りこぼした指を掃除する（押しっぱなし防止）
function pruneTouches(e) {
    const alive = new Set();
    for (const t of e.touches) alive.add(t.identifier);
    for (const id of pointers.keys()) {
        if (id !== 'mouse' && !alive.has(id)) pointers.delete(id);
    }
}

document.addEventListener('touchstart', e => {
    Sound.unlock();
    let claimed = false;
    for (const t of e.changedTouches) {
        const z = zoneAt(t.clientX, t.clientY);
        if (z) {
            pointers.set(t.identifier, { zone: z, x: t.clientX, y: t.clientY, seq: ++pointerSeq });
            claimed = true;
        }
    }
    pruneTouches(e);
    if (claimed) e.preventDefault();
    recomputeInput();
}, { passive: false });

document.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
        const p = pointers.get(t.identifier);
        if (p) { p.x = t.clientX; p.y = t.clientY; }
    }
    pruneTouches(e);
    recomputeInput();
    e.preventDefault(); // スクロール・引っぱり更新を防ぐ
}, { passive: false });

function onTouchEnd(e) {
    let mine = false;
    for (const t of e.changedTouches) {
        if (pointers.delete(t.identifier)) mine = true;
    }
    pruneTouches(e);
    if (mine) e.preventDefault();
    recomputeInput();
    Sound.unlock(); // iOSは指を離したタイミングでの有効化が確実
}
document.addEventListener('touchend', onTouchEnd, { passive: false });
document.addEventListener('touchcancel', onTouchEnd, { passive: false });

// PCでの動作確認用：マウスでもボタンを押せる
document.addEventListener('mousedown', e => {
    Sound.unlock();
    const z = zoneAt(e.clientX, e.clientY);
    if (!z) return;
    e.preventDefault();
    pointers.set('mouse', { zone: z, x: e.clientX, y: e.clientY, seq: ++pointerSeq });
    recomputeInput();
});
document.addEventListener('mousemove', e => {
    const p = pointers.get('mouse');
    if (p) { p.x = e.clientX; p.y = e.clientY; recomputeInput(); }
});
document.addEventListener('mouseup', () => {
    if (pointers.delete('mouse')) recomputeInput();
});

document.addEventListener('contextmenu', e => e.preventDefault());

// キーボード（PC用・元のまま使える）＋ P / Esc で一時停止
window.addEventListener('keydown', e => {
    Sound.unlock();
    if (Object.prototype.hasOwnProperty.call(kbd, e.code)) {
        kbd[e.code] = true;
        if (e.code === 'Space') e.preventDefault();
        recomputeInput();
    } else if (e.code === 'KeyP' || e.code === 'Escape') {
        togglePause();
    }
});
window.addEventListener('keyup', e => {
    if (Object.prototype.hasOwnProperty.call(kbd, e.code)) {
        kbd[e.code] = false;
        recomputeInput();
    }
});

function releaseAll() {
    pointers.clear();
    kbd.ArrowLeft = kbd.ArrowRight = kbd.Space = false;
    recomputeInput();
}
window.addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        pauseGame();
        releaseAll();
    }
});

// ============================================================
//  ボタン
// ============================================================
actionButton.addEventListener('click', () => {
    Sound.unlock();
    if (gameState === 'PAUSED') {
        Sound.ui();
        resumeGame();
        return;
    }
    Sound.start();
    if (gameState === 'STAGE_CLEAR') currentStage++;
    else currentStage = 1;
    startStage();
});

btnSound.addEventListener('click', e => {
    Sound.unlock();
    Sound.setMuted(!Sound.muted);
    updateSoundIcon();
    Sound.ui();
    e.currentTarget.blur();
});

btnPause.addEventListener('click', e => {
    Sound.unlock();
    Sound.ui();
    togglePause();
    e.currentTarget.blur();
});

// 全画面（Android Chrome など対応ブラウザのみ表示）
const canFullscreen = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
if (!canFullscreen) btnFull.hidden = true;
btnFull.addEventListener('click', async e => {
    Sound.unlock();
    e.currentTarget.blur();
    const el = document.documentElement;
    try {
        if (!(document.fullscreenElement || document.webkitFullscreenElement)) {
            if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            try { await screen.orientation.lock('landscape'); } catch (err) {}
        } else {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    } catch (err) { /* 使えない環境では何もしない */ }
});

// ============================================================
//  画面サイズ対応
// ============================================================
function resize() {
    const r = screenEl.getBoundingClientRect();
    const availW = Math.max(1, r.width);
    const availH = Math.max(1, r.height);

    VIEW_HEIGHT = BASE_VIEW_H;
    VIEW_WIDTH = Math.round(Math.min(1000, Math.max(600, BASE_VIEW_H * availW / availH)));

    const scale = Math.min(availW / VIEW_WIDTH, availH / VIEW_HEIGHT);
    const cssW = Math.max(1, Math.floor(VIEW_WIDTH * scale));
    const cssH = Math.max(1, Math.floor(VIEW_HEIGHT * scale));
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';

    // 高解像度画面でもくっきり描く
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    renderScale = canvas.width / VIEW_WIDTH;

    resizeMinimap();
    measureZones();
    clampCamera();
}
let resizeQueued = false;
function queueResize() {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(() => { resizeQueued = false; resize(); });
}
window.addEventListener('resize', queueResize);
window.addEventListener('orientationchange', () => setTimeout(queueResize, 150));
document.addEventListener('fullscreenchange', queueResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', queueResize);

const portraitMQ = window.matchMedia('(orientation: portrait) and (pointer: coarse)');
const onOrientation = () => { if (portraitMQ.matches) { pauseGame(); releaseAll(); } queueResize(); };
if (portraitMQ.addEventListener) portraitMQ.addEventListener('change', onOrientation);
else if (portraitMQ.addListener) portraitMQ.addListener(onOrientation);

if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueResize);

// ============================================================
//  起動
// ============================================================
showOverlay({
    title: 'Mr.JETPACK',
    color: '#ffd700',
    message: 'コインを10枚集めて、旗をめざそう',
    button: 'START GAME',
    legend: true,
    hint: true
});
updateSoundIcon();
updatePauseIcon();
resize();
snapCamera();
requestAnimationFrame(frame);
</script>
